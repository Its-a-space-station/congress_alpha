[project]
name = "congress-alpha"
version = "0.1.0"
description = "Local-first research engine for public congressional financial disclosures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.22",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
